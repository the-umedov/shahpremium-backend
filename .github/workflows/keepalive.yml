name: Keep Render services awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -sf --max-time 60 https://shahpremium-backend.onrender.com/api/v1/health || true
      - name: Ping frontend
        run: curl -sf --max-time 60 https://shahpremium-frontend.onrender.com/ || true
